[project]
name = "kalshi-bot"
version = "0.1.0"
description = "Automated trading bot for Kalshi prediction markets"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "websockets>=13.0",
    "pydantic>=2.5",
    "structlog>=24.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "cryptography>=41.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
kalshi-bot = "main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
